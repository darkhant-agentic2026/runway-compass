name: Deploy (Cloud Run)

# docs/07-infra-deploy.md#deploy-cloudrunyml:
#
#   1. auth to GCP via Workload Identity Federation (no keys)
#   2. docker build + push to Artifact Registry, tagged with the commit SHA
#   3. gcloud run deploy --image ...:$SHA --no-traffic --tag=candidate
#   4. smoke test the candidate revision URL: /livez, /readyz, one authenticated round-trip
#   5. gcloud run services update-traffic --to-tags candidate=100  (or 10 -> 100 canary in prod)
#   6. on smoke-test failure: leave traffic on the previous revision, fail loudly
#
# Rollback is `update-traffic --to-revisions <previous>=100`. Because the SPA lives in the
# same image, a rollback reverts the frontend with it.
#
# THIS WORKFLOW DOES NOT RUN TERRAFORM, deliberately.
#
# docs/07 originally described a `terraform plan -> apply` step here while its
# "IAM (least privilege)" table granted `github-deployer-sa` only `run.admin`,
# `artifactregistry.writer`, and `iam.serviceAccountUser` — the two halves of the document
# disagreed. Applying this stack means creating service accounts, project IAM bindings, a
# Firestore database, and Secret Manager secrets, which is near-admin over the project
# plus write access to the state bucket.
#
# The disagreement was settled in favour of the IAM table: CI ships images, and
# infrastructure changes are an operator action run from `infra/terraform/RUNBOOK.md`.
# A bad merge can therefore deploy a bad image, which the smoke test below catches and
# which `update-traffic` reverses in seconds — it cannot rewrite IAM or delete the
# database. Drift is covered by the nightly Terraform plan check in
# docs/08-testing.md#ci-wiring, which runs somewhere that can hold read credentials.
#
# The consequence to remember: **the running image is chosen here, not by Terraform.**
# `var.image` only seeds the service at creation, and the Cloud Run module ignores
# subsequent image changes so a later `terraform apply` cannot roll production back to
# whatever tag an operator last passed on the command line.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        required: true
        default: dev
        type: choice
        options: [dev, prod]

concurrency:
  # Never two deploys to one environment at once: step 5 would race on traffic.
  group: deploy-${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev') }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required for Workload Identity Federation. No service-account keys exist anywhere.
  id-token: write

jobs:
  deploy:
    name: Build, apply, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A GitHub Environment protection rule requires approval for prod
    # (docs/07-infra-deploy.md#deploy-cloudrunyml).
    environment: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev') }}

    env:
      ENVIRONMENT: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev') }}
      REGION: us-central1
      SERVICE: coach-api

    steps:
      - uses: actions/checkout@v5

      # --- 1. auth, keylessly -------------------------------------------------------
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: '580.0.0'

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # --- 2. build and push --------------------------------------------------------
      #
      # Vite needs the environment's Identity Platform configuration at build time, and
      # these come from Terraform outputs rather than being copied by hand into CI. They
      # are public values by design — the security boundary is the authorized-domains
      # list and server-side token verification, not secrecy of the API key.
      - name: Build and push the image
        id: build
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/coach/${{ env.SERVICE }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg VITE_AUTH_MODE=identity-platform \
            --build-arg VITE_IDENTITY_API_KEY="${{ vars.IDENTITY_API_KEY }}" \
            --build-arg VITE_IDENTITY_AUTH_DOMAIN="${{ vars.IDENTITY_AUTH_DOMAIN }}" \
            --build-arg VITE_IDENTITY_PROJECT_ID="${{ vars.GCP_PROJECT_ID }}" \
            --tag "$IMAGE:${{ github.sha }}" \
            .
          docker push "$IMAGE:${{ github.sha }}"
          echo "image=$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # --- 3. deploy the candidate with no traffic ----------------------------------
      - name: Deploy candidate revision
        id: candidate
        run: |
          set -euo pipefail
          gcloud run deploy "${{ env.SERVICE }}" \
            --image="${{ steps.build.outputs.image }}" \
            --region="${{ env.REGION }}" \
            --no-traffic --tag=candidate \
            --quiet
          # Which revision carries the tag is read by a script, not by an inline
          # expression: this step has failed twice on gcloud output formatting, and
          # inline the only way to test it is to merge and watch.
          # `scripts/candidate_url.sh` is exercised against a stubbed gcloud instead.
          url="$(./scripts/candidate_url.sh "${{ env.SERVICE }}" "${{ env.REGION }}")"
          echo "Candidate URL: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # --- 4. smoke test ------------------------------------------------------------
      - name: Smoke test the candidate
        run: ./scripts/smoke.sh "${{ steps.candidate.outputs.url }}"

      # --- 5. shift traffic ---------------------------------------------------------
      - name: Shift traffic (dev - straight to 100%)
        if: env.ENVIRONMENT == 'dev'
        run: |
          gcloud run services update-traffic "${{ env.SERVICE }}" \
            --region="${{ env.REGION }}" --to-tags candidate=100 --quiet

      - name: Shift traffic (prod - 10% canary, then 100%)
        if: env.ENVIRONMENT == 'prod'
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${{ env.SERVICE }}" \
            --region="${{ env.REGION }}" --to-tags candidate=10 --quiet
          sleep 120
          curl -fsS --max-time 30 "${{ steps.candidate.outputs.url }}/livez" >/dev/null
          gcloud run services update-traffic "${{ env.SERVICE }}" \
            --region="${{ env.REGION }}" --to-tags candidate=100 --quiet

      # --- 6. fail loudly, leaving traffic where it was -----------------------------
      - name: Report a failed rollout
        if: failure()
        run: |
          echo "::error::Rollout failed. Traffic was NOT shifted to the candidate revision;"
          echo "::error::the previous revision is still serving. Roll back explicitly with:"
          echo "::error::  gcloud run services update-traffic ${{ env.SERVICE }} \\"
          echo "::error::    --region=${{ env.REGION }} --to-revisions <previous>=100"
          exit 1
