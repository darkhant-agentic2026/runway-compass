<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runway Compass</title>
    <meta name="theme-color" content="#ffffff" />

    <!--
      THEME, APPLIED BEFORE FIRST PAINT. docs/06-frontend.md#applied-before-first-paint

      This must stay inline and must stay above the stylesheet: there is no SSR, so
      without it the page paints light, mounts React, then flips — a visible flash that
      is worst in dark mode. It must NOT be `defer`red, `type="module"`, or moved into
      an external file; any of those runs it too late, and an external file would add a
      round trip before paint, which is the thing being avoided.

      It reads a PLAIN STRING from localStorage['coach.theme']. `useThemeStore` writes
      that key in exactly this format, deliberately bypassing Zustand's `persist`
      middleware, whose {state, version} envelope this reader would choke on. The two
      are coupled across a boundary the type system cannot see, so the contract is
      pinned by a test: src/stores/theme.test.ts.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('coach.theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          // Without this, native scrollbars, form controls, and the pre-paint canvas
          // stay light while everything else goes dark.
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* private mode: fall through to light */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
